max_batch: 2
use_cuda_graph: true
# Used by the future full three-stage path; collapsed mode keeps legacy EOS behavior.
post_eos_padding_count: 128
internal_stop_token_id: 17
talker_max_steps_after_last_thinker_token: 192
stages:
  - name: thinker
    default_sampling_params:
      temperature: 0.7
      max_tokens: 512
  - name: talker
    default_sampling_params:
      temperature: 0.2
      watchdog_limit: 192
  - name: code2wav
    default_sampling_params: {}