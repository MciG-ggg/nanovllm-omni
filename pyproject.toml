[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanovllm-omni"
version = "0.1.0"
description = "A minimal, readable reference implementation of vllm-omni's stage-based serving architecture"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "nanovllm-omni contributors" },
]
keywords = ["vllm", "omni", "diffusion", "vla", "inference", "serving"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "black>=24.0",
]
# Real-weight MiniMind-O path: required for examples/audio.py and the
# `pytest -m smoke` suite. ~1 GB checkpoint is downloaded from the HF
# Hub on first execute, not at install time.
minimind = [
    "torch>=2.0",
    "transformers>=4.50",
    "huggingface_hub>=0.20",
    "soundfile>=0.12",
]

# PEP 735 dependency groups. The `minimind` group mirrors the
# `[minimind]` optional extra so `uv sync` picks it up via
# `[tool.uv] default-groups` below. CI stays unaffected because it
# installs via `pip install -e ".[dev]"` and never reads this table.
[dependency-groups]
minimind = [
    "torch>=2.0",
    "transformers>=4.50",
    "huggingface_hub>=0.20",
    "soundfile>=0.12",
]

[project.urls]
Homepage = "https://github.com/MciG-ggg/nanovllm-omni"
Documentation = "https://github.com/MciG-ggg/nanovllm-omni/blob/main/docs/"
Issues = "https://github.com/MciG-ggg/nanovllm-omni/issues"

[tool.uv]
# Make `uv sync` install the real-weight MiniMind-O group by default so
# `python examples/audio.py` works out of the box. CI is unaffected: it
# uses `pip install -e ".[dev]"` which only reads
# `[project.optional-dependencies]`, never `[dependency-groups]`.
default-groups = ["minimind"]

[tool.setuptools]
packages = [
    "nanovllm_omni",
    "nanovllm_omni.diffusion",
    "nanovllm_omni.models",
    "nanovllm_omni.runtime",
    "nanovllm_omni.serving",
]

[tool.setuptools.package-data]
nanovllm_omni = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
markers = [
    "smoke: tests that load real model weights (manual only, slow)",
    "slow: tests that take more than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true