name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Fast path: lint + format + tests that don't need torch.
  # Uses uv so [tool.uv.sources] (third_party/nano-vllm) resolves the
  # same way locally and on CI. See pyproject.toml [tool.uv.sources].
  lint-and-test:
    name: Lint + Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          # uv reads [tool.uv.sources] so the local fork at
          # third_party/nano-vllm installs via path, not PyPI.
          # --extra dev pulls the dev optional-dependency group
          # (pytest + ruff + black).
          uv sync --extra dev

      - name: Lint with ruff
        run: |
          uv run ruff check nanovllm_omni/ tests/

      - name: Format check with black
        run: |
          uv run black --check nanovllm_omni/ tests/

      - name: Public-API import check
        run: |
          # The aligned public surface must stay importable.
          # See AGENTS.md ``CI-equivalent checks``.
          uv run python -c "from nanovllm_omni import Omni, AsyncOmni, SamplingParams, OmniRequestOutput"

      - name: Compileall
        run: |
          uv run python -m compileall -q nanovllm_omni

      - name: Run unit tests (skip smoke + skip torch-requiring)
        run: |
          # -m "not smoke" excludes the smoke-marked tests (those need real
          # model weights + GPU). The torch-using test files self-skip on
          # the missing torch import; see test_optim_*.py docstrings.
          uv run pytest -m "not smoke" -v

  # Slow path: same matrix, but with torch so the torch-using unit
  # tests actually run. CUDA-specific graph tests still skip on this
  # runner (no GPU); a real GPU runner is tracked separately.
  lint-and-test-torch:
    name: Lint + Test + torch (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dev + CPU torch
        run: |
          uv sync --extra dev
          # CPU-only torch keeps the slow-path light (no CUDA wheel).
          # numpy is needed by the bench test fakes (a fake tensor's
          # .numpy() helper lazy-imports it).
          uv pip install --index-url https://download.pytorch.org/whl/cpu torch numpy

      - name: Lint with ruff
        run: |
          uv run ruff check nanovllm_omni/ tests/

      - name: Format check with black
        run: |
          uv run black --check nanovllm_omni/ tests/

      - name: Run unit tests with torch (skip smoke)
        run: |
          uv run pytest -m "not smoke" -v

  docs-build:
    name: Docs build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv pip install mkdocs mkdocs-material
      - run: |
          # Lightweight smoke test: confirm mkdocs config parses.
          # Real build deferred until docs/ has content (Phase 6).
          uv run python -c "import yaml; yaml.safe_load(open('mkdocs.yml')) if __import__('os').path.exists('mkdocs.yml') else print('mkdocs.yml not yet created -- skipping (deferred to Phase 6)')"
