# Three-stage thinker -> talker -> code2wav pipeline (RTX 3050 validated).
# Graph-vs-eager is a per-stage decision; comparison code belongs in
# bench/, not in this deploy config.
stages:
  - name: thinker
    max_num_batched_tokens: 512
    max_num_seqs: 1
    gpu_memory_utilization: 0.6
    default_sampling_params:
      temperature: 0.7
      max_tokens: 512
  - name: talker
    max_num_batched_tokens: 256
    max_num_seqs: 1
    gpu_memory_utilization: 0.2
    default_sampling_params:
      temperature: 0.2
      watchdog_limit: 192
  - name: code2wav
    max_num_batched_tokens: 64
    max_num_seqs: 1
    gpu_memory_utilization: 0.1
    default_sampling_params: {}
