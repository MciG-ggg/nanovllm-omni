# MiniMind-O decode: graph (stage default) vs the eager comparison cell.
# See docs/adr/0005 for why the choice lives at the stage and not in deploy.
family: minimind
model: /home/mcig/models/minimind-3o
runs: 5
warmup: 1
max_tokens: 120
seed: 7
device: cuda
cells:
  - name: graph
    flags:
      use_thinker_cuda_graph: true
  - name: eager
    flags:
      use_thinker_cuda_graph: false
  # Throughput and output identity as a function of batch size: every
  # request in a batch must produce the audio it produced on its own.
  - name: batch
    flags:
      bench_mode: batch
      use_thinker_cuda_graph: true
  # Same sweep with a CUDA graph per batch bucket. Faster batches, but the
  # bs=1 graph then no longer matches eager byte-for-byte (ADR-0012).
  - name: batch-graphed
    flags:
      bench_mode: batch
      use_thinker_cuda_graph: true
      thinker_max_capture_bs: 8
