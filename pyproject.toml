[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanovllm-omni"
version = "0.1.0"
description = "Smallest vllm-omni-compatible pipeline runtime, performance-engineered for MiniMind-O with a continuous-batching thinker runner and unified omni-modal I/O contract demos."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "nanovllm-omni contributors" },
]
keywords = ["vllm-omni", "minimind", "stage-replica", "omni-i-o-contract", "mini-vla", "tts", "image-diffusion"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "black>=24.0",
]
smolvla = [
    "torch>=2.3.1",
    "transformers>=4.40",
    "lerobot>=0.3",
    "Pillow>=10.0",
    "huggingface_hub>=0.20",
    "numpy>=1.24",
]
# Gradio UI demo layer (`nanovllm_omni.serving.app`). UI tool, NOT a server
# framework -- leaves the stdlib HTTP adapter in `nanovllm_omni.serving.openai_adapter`
# untouched. Install alongside a model-family extra (e.g. `.[minimind,gradio]`)
# to actually run a tab; `gradio` alone only enables the demo launcher.
gradio = [
    "gradio>=5.0,<6.0",
]
# Real-weight MiniMind-O path: required for
# examples/offline_inference/minimind_o/{end2end,batched}.py and the
# `pytest -m smoke` suite. The bundle loader is offline-first; weights
# must be pre-provisioned (see
# examples/offline_inference/minimind_o/README.md) before the smoke
# tests can run, not pulled at install time. funasr/librosa/onnxruntime
# are peer deps of the MiniMind trust_remote_code modeling files.
minimind = [
    "torch>=2.0",
    "transformers>=4.50",
    "huggingface_hub>=0.20",
    "soundfile>=0.12",
    "librosa>=0.10",
    "onnxruntime>=1.16",
    "funasr>=1.0",
]
# PEP 735 dependency groups. The `minimind` group mirrors the
# `[minimind]` optional extra so `uv sync` picks it up via
# `[tool.uv] default-groups` below. CI stays unaffected because it
# installs via `pip install -e ".[dev]"` and never reads this table.
[dependency-groups]
minimind = [
    "torch>=2.0",
    "transformers>=4.50",
    "huggingface_hub>=0.20",
    "soundfile>=0.12",
    "librosa>=0.10",
    "onnxruntime>=1.16",
    "funasr>=1.0",
    # int8 stretch for TK-015 -- optional; install explicitly if you want it.
    "bitsandbytes>=0.43",
]
# Mirrors `[project.optional-dependencies].gradio` so `uv sync` picks it
# up if wired into default-groups. Off by default; the UI launcher is an
# opt-in convenience.
gradio = [
    "gradio>=5.0,<6.0",
]

[project.urls]
Homepage = "https://github.com/MciG-ggg/nanovllm-omni"
Documentation = "https://github.com/MciG-ggg/nanovllm-omni/blob/main/docs/"
Issues = "https://github.com/MciG-ggg/nanovllm-omni/issues"

[tool.uv]
# Make `uv sync` install the real-weight MiniMind-O group by default so
# `python examples/audio.py` works out of the box. CI is unaffected: it
# uses `pip install -e ".[dev]"` which only reads
# `[project.optional-dependencies]`, never `[dependency-groups]`.
default-groups = ["minimind"]

[tool.setuptools]
packages = [
    "nanovllm_omni",
    "nanovllm_omni.config",
    "nanovllm_omni.engine",
    "nanovllm_omni.entrypoints",
    "nanovllm_omni.models",
    "nanovllm_omni.models.minimind_omni",
    "nanovllm_omni.models.sd_turbo",
    "nanovllm_omni.models.smolvla",
    "nanovllm_omni.models.smolvlm",
    "nanovllm_omni.engine.bench",
    "nanovllm_omni.serving",

]

[tool.setuptools.package-data]
nanovllm_omni = ["deploy/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
markers = [
    "smoke: tests that load real model weights (manual only, slow)",
    "slow: tests that take more than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true