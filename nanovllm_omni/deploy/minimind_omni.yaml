# Three-stage thinker -> talker -> code2wav pipeline (RTX 3050 validated).
max_batch: 2
use_cuda_graph: true
post_eos_padding_count: 128
internal_stop_token_id: 17
talker_max_steps_after_last_thinker_token: 192
stages:
  - name: thinker
    max_num_batched_tokens: 512
    max_num_seqs: 1
    gpu_memory_utilization: 0.6
    enforce_eager: false
    default_sampling_params:
      temperature: 0.7
      max_tokens: 512
  - name: talker
    max_num_batched_tokens: 256
    max_num_seqs: 1
    gpu_memory_utilization: 0.2
    enforce_eager: false
    default_sampling_params:
      temperature: 0.2
      watchdog_limit: 192
  - name: code2wav
    max_num_batched_tokens: 64
    max_num_seqs: 1
    gpu_memory_utilization: 0.1
    enforce_eager: true
    default_sampling_params: {}
